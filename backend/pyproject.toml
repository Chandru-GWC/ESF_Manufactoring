[project]
name = "ehs-safety-ai-backend"
version = "1.0.0"
description = "EHS & Safety AI Platform - FastAPI backend (multi-agent orchestration, video analytics, alerts, data connectors)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "cryptography>=43",
    # Dashboard exports
    "openpyxl>=3.1",
    "fpdf2>=2.8",
    # Database connector adapters (backend/docs/DATABASE_CONNECTORS.md)
    "pymysql>=1.1",
    "pymongo>=4.10",
    "pymssql>=2.3",
    "oracledb>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
# Video-analytics workers (YOLO, MediaPipe, OWLv2). Heavy - install only where CV runs.
vision = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10",
    "torch>=2.2",
    "transformers>=4.40",
    "ultralytics>=8.3",
    "mediapipe>=0.10",
    "imageio-ffmpeg>=0.5",  # bundled ffmpeg: turns annotated videos into browser-playable H.264
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
